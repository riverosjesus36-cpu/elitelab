<script id="pwa-init">
try{(function(){
  try{
    var manifest={name:"EliteLab",short_name:"EliteLab",description:"Productividad gamificada",start_url:"./",display:"standalone",background_color:"#0a0a0a",theme_color:"#e53e3e"};
    var blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    var murl=URL.createObjectURL(blob);
    var lnk=document.createElement('link');lnk.rel='manifest';lnk.href=murl;document.head.appendChild(lnk);
  }catch(e){}
  try{
    var sw='self.addEventListener("install",function(e){self.skipWaiting();});self.addEventListener("activate",function(e){clients.claim();});self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).catch(function(){return new Response("");}));});';
    if('serviceWorker' in navigator){
      var swb=new Blob([sw],{type:'text/javascript'});
      var swu=URL.createObjectURL(swb);
      navigator.serviceWorker.register(swu).catch(function(){});
    }
  }catch(e){}
  window._dip=null;
  try{
    window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._dip=e;});
    window.addEventListener('appinstalled',function(){window._dip=null;window._installed=true;});
  }catch(e){}
})();}catch(e){}
</script>

/* RADAR */
function Radar({scores}){
  const cats=[
    {l:'Físico',k:'fisico'},{l:'Productividad',k:'productividad'},
    {l:'Financiero',k:'financiero'},{l:'Disciplina',k:'disciplina'},{l:'Mental',k:'mental'}
  ];
  const n=cats.length,cx=120,cy=120,r=85;
  const pt=(a,rr)=>({x:cx+rr*Math.sin(a),y:cy-rr*Math.cos(a)});
  const angles=cats.map((_,i)=>(2*Math.PI*i)/n);
  const rings=[.2,.4,.6,.8,1];
  const rp=rings.map(f=>{
    const ps=angles.map(a=>pt(a,r*f));
    return ps.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+' Z';
  });
  const dp=()=>{
    const ps=cats.map((c,i)=>{const v=Math.min(100,Math.max(0,scores[c.k]||0));return pt(angles[i],r*(v/100));});
    return ps.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+' Z';
  };
  const total=Math.round(cats.reduce((a,c)=>a+(scores[c.k]||0),0)/n);
  return(
    <svg width="240" height="240" viewBox="0 0 240 240">
      {rp.map((d,i)=><path key={i} d={d} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>)}
      {angles.map((a,i)=>{const p=pt(a,r);return<line key={i} x1={cx} y1={cy} x2={p.x.toFixed(1)} y2={p.y.toFixed(1)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>;})}
      <path d={dp()} fill="rgba(229,62,62,0.18)" stroke="#e53e3e" strokeWidth="2"/>
      {cats.map((c,i)=>{const v=Math.min(100,Math.max(0,scores[c.k]||0));const pp=pt(angles[i],r*(v/100));return<circle key={i} cx={pp.x.toFixed(1)} cy={pp.y.toFixed(1)} r="4" fill="#e53e3e"/>;})}
      {cats.map((c,i)=>{const lp=pt(angles[i],r+18);return<text key={i} x={lp.x.toFixed(1)} y={lp.y.toFixed(1)} textAnchor="middle" dominantBaseline="middle" fill="rgba(255,255,255,0.4)" fontSize="11">{c.l}</text>;})}
      <text x={cx} y={cy-8} textAnchor="middle" fill="#fff" fontSize="26" fontWeight="800">{total}</text>
      <text x={cx} y={cy+14} textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize="10" letterSpacing="2">SCORE</text>
    </svg>
  );
}

/* LINE CHART SIMPLE */
function LineChart({data,color='#e53e3e'}){
  if(!data||data.length<2) return null;
  const w=580,h=80,pad=30;
  const max=Math.max(...data,1);
  const xs=data.map((_,i)=>pad+(i/(data.length-1))*(w-2*pad));
  const ys=data.map(v=>h-pad-(v/max)*(h-2*pad));
  const line=xs.map((x,i)=>`${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const area=line+` L${xs[xs.length-1].toFixed(1)},${h-pad} L${xs[0].toFixed(1)},${h-pad} Z`;
  return(
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{display:'block'}}>
      <path d={area} fill={color} opacity="0.08"/>
      <path d={line} fill="none" stroke={color} strokeWidth="2"/>
      {xs.map((x,i)=><circle key={i} cx={x.toFixed(1)} cy={ys[i].toFixed(1)} r="3" fill={color}/>)}
    </svg>
  );
}

      )}

            <div style={{fontSize:13,fontWeight:500,color:'var(--t2)'}}>{a.l}</div>

      {/* STATS 3-col */}

          <div style={{fontSize:10,fontWeight:700,letterSpacing:1.2,textTransform:'uppercase',color:'var(--t2)',marginBottom:12,display:'flex',justifyContent:'space-between'}}>⊟ TU DINERO<span style={{color:'var(--t3)',cursor:'pointer'}}>○</span></div>
          <div style={{fontSize:30,fontWeight:800}}>${(inc-exp).toLocaleString()}.00</div>

          <div style={{fontSize:30,fontWeight:800}}>{scores.mental}<span style={{fontSize:16,color:'var(--t3)'}}>/100</span></div>

        <div className="card2">

          <div style={{fontSize:38,fontWeight:800}}>{habits.length>0?Math.round((hDone/habits.length)*100):0}<span style={{fontSize:16,color:'var(--t3)'}}>%</span></div>
          <div style={{fontSize:12,color:'var(--t3)',marginTop:3}}>completados hoy</div>
          <div className="pbar" style={{marginTop:10}}>
            <div className="pfill" style={{width:`${habits.length>0?(hDone/habits.length)*100:0}%`,background:'var(--red)'}}></div>

      {/* METAS */}

        </div>
        <div style={{display:'grid',gridTemplateColumns:'240px 1fr',gap:20,alignItems:'center'}}>
          <Radar scores={state.scores}/>
          <div className="g2">

              {l:'FÍSICO',k:'fisico',c:'var(--red)',s:'0/4 treinos',ico:'↗'},
              {l:'PRODUCTIVIDAD',k:'productividad',c:'var(--blue)',s:'0 tarefas · 0 pomodoros',ico:'⚡'},
              {l:'FINANCIERO',k:'financiero',c:'var(--green)',s:'100% no orçamento',ico:'⊟'},
              {l:'DISCIPLINA',k:'disciplina',c:'var(--orange)',s:`0% hábitos · ${Math.max(...[...state.habits.map(h=>h.streak),0])}d streak`,ico:'🔥'},
              {l:'MENTAL',k:'mental',c:'var(--purple)',s:`${goals.filter(g=>g.cur>=g.target).length} metas · ${state.pomodoro.sessionsToday} pomodoros`,ico:'◎'},

              <div key={s.k} style={{background:'var(--bg4)',border:'1px solid var(--bor)',borderRadius:8,padding:'11px 12px',cursor:'pointer'}}>
                <div style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:'uppercase',color:s.c,marginBottom:6,display:'flex',justifyContent:'space-between'}}>{s.ico} {s.l}<span style={{color:'var(--t3)',fontSize:12}}>›</span></div>
                <div style={{fontSize:26,fontWeight:800,color:s.c}}>{state.scores[s.k]||0}</div>
                <div style={{fontSize:11,color:'var(--t3)',marginTop:3}}>{s.s}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* SCORE BOTTOM */}
      <div className="g2">
        {[
          {l:'FÍSICO',k:'fisico',good:false},{l:'PRODUCTIVIDAD',k:'productividad',good:false},
          {l:'MENTAL',k:'mental',good:false},{l:'FINANCIERO',k:'financiero',good:true},
          {l:'DISCIPLINA',k:'disciplina',good:false},
        ].map(s=>(
          <div key={s.k} style={{background:'var(--bg2)',border:`1px solid ${s.good?'rgba(72,187,120,0.25)':'rgba(229,62,62,0.25)'}`,borderRadius:10,padding:'14px 16px'}}>

            </div>

        ))}
      </div>
    </div>
  );
}

/* ====================== HABITOS ====================== */
function PageHabitos({state,setState,showToast}){
  const [showMod,setShowMod]=useState(false);
  const [form,setForm]=useState({name:'',cat:'aprendizaje',xp:15,icon:'📋'});
  const CATS=['salud','aprendizaje','trabajo','mente','deportes','finanzas','otros'];
  const ICONS=['📋','🔥','📗','💪','🧘','🎯','💰','🤝','⭐','🚀','📚','🏃'];
  const now=new Date();
  const month=now.getMonth();const year=now.getFullYear();
  const days=new Date(year,month+1,0).getDate();
  const dayChartData=Array.from({length:days},(_,i)=>0);// placeholder

  const toggle=(id)=>{
    setState(p=>{
      const habits=p.habits.map(h=>{
        if(h.id!==id) return h;
        const done=!h.doneToday;
        return{...h,doneToday:done,streak:done?h.streak+1:Math.max(0,h.streak-1)};
      });
      const h=habits.find(h=>h.id===id);
      let scores={...p.scores};
      if(h.doneToday){showToast({icon:'🔥',title:`+${h.xp} XP`,sub:h.name});scores.disciplina=(scores.disciplina||0)+1;}
      return{...p,habits,scores};
    });
  };
  const add=()=>{
    if(!form.name.trim()) return;
    setState(p=>({...p,habits:[...p.habits,{id:Date.now(),name:form.name,streak:0,doneToday:false,xp:Number(form.xp),cat:form.cat,icon:form.icon}]}));
    setForm({name:'',cat:'aprendizaje',xp:15,icon:'📋'});
    setShowMod(false);
  };
  const del=(id)=>setState(p=>({...p,habits:p.habits.filter(h=>h.id!==id)}));
  const done=state.habits.filter(h=>h.doneToday).length;
  const tot=state.habits.length;
  const monthStr=now.toLocaleDateString('es',{month:'long',year:'numeric'});
  const todayD=now.getDate();

  return(
    <div>
      <div className="ph">
        <div>
          <div className="st">Hábitos</div>
          <div className="st-sub">Control de ejecución diaria — hábitos y progreso.</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:24,fontWeight:800,color:'var(--red)'}}>{tot>0?Math.round((done/tot)*100):0}%</div>
            <div style={{fontSize:11,color:'var(--t3)'}}>Progreso {monthStr.split(' ').slice(-1)[0]}</div>
          </div>
          <button className="btn-r-lg" onClick={()=>setShowMod(true)}>+ Agregar</button>
        </div>
      </div>

      {/* TODAY BAR */}
      <div style={{background:'var(--bg2)',border:'1px solid var(--bor)',borderRadius:10,padding:'13px 16px',marginBottom:14,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span style={{fontSize:14,fontWeight:600}}>Hoy: {done}/{tot} hábitos completados</span>
        <span style={{fontSize:13,color:'var(--t3)'}}>Faltan {tot-done}</span>
      </div>

      {/* PROGRESS CHART */}
      <div className="card2" style={{marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:600,marginBottom:14}}>Progreso de {monthStr.charAt(0).toUpperCase()+monthStr.slice(1)}</div>
        <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',fontSize:11,color:'var(--t3)',marginBottom:4}}>
          {['100%','75%','50%','25%','0%'].map(l=><span key={l}>{l}</span>)}
        </div>
        <div style={{height:80,position:'relative',borderBottom:'1px solid var(--bor)',marginBottom:8}}>
          <LineChart data={Array.from({length:todayD},(_,i)=>i<todayD-1?0:0)} color="#e53e3e"/>
          {/* today marker */}
          <div style={{position:'absolute',bottom:0,left:`${((todayD-1)/(days-1))*100}%`,transform:'translateX(-50%)'}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:'var(--red)',border:'2px solid var(--bg)',marginBottom:-5}}></div>
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t3)'}}>
          {[1,4,7,10,13,16,19,22,25,28,31].map(d=><span key={d}>{d}</span>)}
        </div>
      </div>

      {/* GRILLA */}
      <div className="card2" style={{marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div>
            <div style={{fontSize:14,fontWeight:600}}>Grilla de Hábitos</div>
            <div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>Arrastra ⠿ para reordenar · Clic en ✏ para editar</div>
          </div>
          <div style={{fontSize:12,color:'var(--t3)'}}>Semana {todayD-6 < 1 ? 1 : todayD-6}/5 — {todayD}/5</div>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'separate',borderSpacing:'3px'}}>
            <thead>
              <tr>
                <th style={{textAlign:'left',fontSize:12,color:'var(--t3)',fontWeight:500,padding:'4px 8px',width:120}}>Hábito</th>
                {Array.from({length:Math.min(23,days)},(_,i)=>(
                  <th key={i} style={{fontSize:10,color:i+1===todayD?'var(--red)':'var(--t3)',fontWeight:500,padding:'4px 3px',textAlign:'center',width:24}}>
                    <div style={{width:22,height:22,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:i+1===todayD?'var(--red)':'transparent',color:i+1===todayD?'#fff':'inherit'}}>{i+1}</div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {state.habits.map(h=>(
                <tr key={h.id}>
                  <td style={{padding:'3px 8px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,fontSize:13,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:120}}>
                      <span style={{fontSize:15}}>{h.icon||'📋'}</span>
                      <span style={{overflow:'hidden',textOverflow:'ellipsis'}}>{h.name}</span>
                    </div>
                  </td>
                  {Array.from({length:Math.min(23,days)},(_,i)=>(
                    <td key={i} style={{textAlign:'center',padding:'2px'}}>
                      <div onClick={()=>i+1===todayD&&toggle(h.id)} style={{width:20,height:20,borderRadius:4,border:`1px solid ${i+1===todayD?'rgba(229,62,62,0.5)':'var(--bor)'}`,background:h.doneToday&&i+1===todayD?'var(--green)':'var(--bg4)',cursor:i+1===todayD?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'#fff'}}>{h.doneToday&&i+1===todayD&&'✓'}</div>
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--bor)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <button className="btn btn-r" onClick={()=>setShowMod(true)}>+ Agregar</button>
          <div style={{display:'flex',gap:8}}>
            <span style={{fontSize:13,color:'var(--t3)'}}>Hoy: {done} de {tot} completados</span>
            <span style={{fontSize:13,color:'var(--red)',fontWeight:600}}>{tot>0?Math.round((done/tot)*100):0}%</span>
          </div>
        </div>
      </div>

      {showMod&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setShowMod(false)}>
          <div className="mod">
            <div className="mod-t">Nuevo Hábito</div>
            <div className="fg"><label className="fl">NOMBRE</label><input className="inp" placeholder="ej. Hacer ejercicio" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} onKeyDown={e=>e.key==='Enter'&&add()} autoFocus/></div>
            <div className="frow">
              <div className="fg" style={{flex:2}}><label className="fl">CATEGORÍA</label><select className="inp" value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
              <div className="fg" style={{flex:1}}><label className="fl">XP</label><input className="inp" type="number" min="5" max="100" value={form.xp} onChange={e=>setForm({...form,xp:e.target.value})}/></div>
            </div>
            <div className="fg">
              <label className="fl">ICONO</label>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {ICONS.map(ic=><div key={ic} onClick={()=>setForm({...form,icon:ic})} style={{width:34,height:34,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,cursor:'pointer',border:`2px solid ${form.icon===ic?'var(--red)':'var(--bor)'}`,background:form.icon===ic?'var(--red-dim)':'var(--bg4)'}}>{ic}</div>)}
              </div>
            </div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
              <button className="btn btn-ghost" onClick={()=>setShowMod(false)}>Cancelar</button>
              <button className="btn btn-r" onClick={add}>Crear</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ====================== TAREAS (KANBAN) ====================== */
function PageTareas({state,setState}){
  const [showMod,setShowMod]=useState(false);
  const [view,setView]=useState('kanban');
  const [form,setForm]=useState({name:'',priority:'Alta',tags:'',status:'todo'});
  const COLS=[
    {id:'todo',l:'Por Hacer',c:'var(--t3)',dot:'○'},
    {id:'inprogress',l:'En Progreso',c:'var(--red)',dot:'●'},
    {id:'review',l:'Revisión',c:'var(--orange)',dot:'●'},
    {id:'done',l:'Completado',c:'var(--green)',dot:'●'},
  ];
  const PRIOS=['Alta','Media','Urgente','Baja'];
  const PCOLS={Alta:'var(--red)',Media:'var(--orange)',Urgente:'var(--red)',Baja:'var(--green)'};
  const PBGS={Alta:'rgba(229,62,62,0.15)',Media:'rgba(237,137,54,0.15)',Urgente:'rgba(229,62,62,0.15)',Baja:'rgba(72,187,120,0.15)'};

  const add=()=>{
    if(!form.name.trim()) return;
    const tags=form.tags.split(',').map(t=>t.trim()).filter(Boolean);
    setState(p=>({...p,tasks:[...p.tasks,{id:Date.now(),name:form.name,status:'todo',priority:form.priority,tags}]}));
    setForm({name:'',priority:'Alta',tags:'',status:'todo'});
    setShowMod(false);
  };
  const move=(id,status)=>setState(p=>({...p,tasks:p.tasks.map(t=>t.id===id?{...t,status}:t)}));
  const del=(id)=>setState(p=>({...p,tasks:p.tasks.filter(t=>t.id!==id)}));
  const pending=state.tasks.filter(t=>t.status!=='done').length;
  const pct=state.tasks.length>0?Math.round((state.tasks.filter(t=>t.status==='done').length/state.tasks.length)*100):0;

  return(
    <div>
      <div className="ph">
        <div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span className="st">Tareas</span>
            <span style={{background:'rgba(229,62,62,0.15)',color:'var(--red)',borderRadius:20,padding:'3px 10px',fontSize:12,fontWeight:600}}>{pending} pendientes</span>
          </div>
          <div className="st-sub">{pct}% completadas</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button onClick={()=>setView('kanban')} style={{background:view==='kanban'?'var(--bg3)':'transparent',border:'1px solid var(--bor)',borderRadius:6,padding:'6px 10px',cursor:'pointer',color:view==='kanban'?'#fff':'var(--t3)'}}>⊞</button>
          <button onClick={()=>setView('list')} style={{background:view==='list'?'var(--bg3)':'transparent',border:'1px solid var(--bor)',borderRadius:6,padding:'6px 10px',cursor:'pointer',color:view==='list'?'#fff':'var(--t3)'}}>≡</button>
          <button className="btn-r-lg" onClick={()=>setShowMod(true)}>+ Nueva Tarea</button>
        </div>
      </div>

      {view==='kanban'?(
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}}>
          {COLS.map(col=>{
            const colTasks=state.tasks.filter(t=>t.status===col.id);
            return(
              <div key={col.id}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                  <span style={{color:col.c,fontSize:14}}>{col.dot}</span>
                  <span style={{fontSize:13,fontWeight:600,color:col.id==='todo'?'var(--t2)':'#fff'}}>{col.l}</span>
                  <span style={{marginLeft:'auto',background:'var(--bg4)',borderRadius:12,padding:'1px 7px',fontSize:11,color:'var(--t3)'}}>{colTasks.length}</span>
                  {col.id==='todo'&&<button onClick={()=>setShowMod(true)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:16}}>+</button>}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:8,minHeight:100}}>
                  {colTasks.length===0?(
                    <div style={{border:'1px dashed var(--bor)',borderRadius:8,padding:'20px',textAlign:'center',color:'var(--t3)',fontSize:12}}>Vacío</div>
                  ):colTasks.map(t=>(
                    <div key={t.id} style={{background:'var(--bg3)',border:'1px solid var(--bor)',borderRadius:9,padding:'12px'}}>
                      <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:8}}>
                        <div onClick={()=>move(t.id,t.status==='done'?'todo':'done')} style={{width:18,height:18,borderRadius:'50%',border:`2px solid ${t.status==='done'?'var(--green)':'var(--bor2)'}`,flexShrink:0,marginTop:1,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:t.status==='done'?'var(--green)':'transparent'}}>{t.status==='done'&&'✓'}</div>
                        <span style={{flex:1,fontSize:13,fontWeight:500,color:t.status==='done'?'var(--t3)':'#fff',textDecoration:t.status==='done'?'line-through':'none'}}>{t.name}</span>
                        <button className="del" onClick={()=>del(t.id)}>✕</button>
                      </div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                        <span style={{background:PBGS[t.priority]||'var(--bg4)',color:PCOLS[t.priority]||'var(--t2)',borderRadius:12,padding:'2px 8px',fontSize:11,fontWeight:600}}>{t.priority==='Urgente'?'🔥 ':''}{t.priority}</span>
                        {(t.tags||[]).map(tag=><span key={tag} style={{background:'var(--bg4)',color:'var(--t2)',borderRadius:12,padding:'2px 8px',fontSize:11}}>{tag}</span>)}
                      </div>
                      {col.id!=='done'&&(
                        <select onChange={e=>{if(e.target.value)move(t.id,e.target.value);e.target.value='';}} defaultValue="" style={{marginTop:8,width:'100%',background:'var(--bg4)',border:'1px solid var(--bor)',borderRadius:6,padding:'4px 8px',color:'var(--t3)',fontSize:11,cursor:'pointer'}}>
                          <option value="">Mover a...</option>
                          {COLS.filter(c=>c.id!==col.id).map(c=><option key={c.id} value={c.id}>{c.l}</option>)}
                        </select>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      ):(
        <div>
          {state.tasks.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'11px 14px',background:'var(--bg2)',border:'1px solid var(--bor)',borderRadius:9,marginBottom:6}}>
              <div onClick={()=>move(t.id,t.status==='done'?'todo':'done')} style={{width:18,height:18,borderRadius:'50%',border:`2px solid ${t.status==='done'?'var(--green)':'var(--bor2)'}`,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:t.status==='done'?'var(--green)':'transparent',flexShrink:0}}>{t.status==='done'&&'✓'}</div>
              <span style={{flex:1,fontSize:13,color:t.status==='done'?'var(--t3)':'#fff',textDecoration:t.status==='done'?'line-through':'none'}}>{t.name}</span>
              <span style={{background:PBGS[t.priority],color:PCOLS[t.priority],borderRadius:12,padding:'2px 8px',fontSize:11,fontWeight:600}}>{t.priority}</span>
              {(t.tags||[]).map(tag=><span key={tag} style={{background:'var(--bg4)',color:'var(--t2)',borderRadius:12,padding:'2px 8px',fontSize:11}}>{tag}</span>)}
              <button className="del" onClick={()=>del(t.id)}>✕</button>
            </div>
          ))}
        </div>
      )}

      {showMod&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setShowMod(false)}>
          <div className="mod">
            <div className="mod-t">Nueva Tarea</div>
            <div className="fg"><label className="fl">TAREA</label><input className="inp" placeholder="¿Qué hay que hacer?" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} autoFocus onKeyDown={e=>e.key==='Enter'&&add()}/></div>
            <div className="frow">
              <div className="fg" style={{flex:1}}><label className="fl">PRIORIDAD</label><select className="inp" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>{PRIOS.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
              <div className="fg" style={{flex:2}}><label className="fl">TAGS (separados por coma)</label><input className="inp" placeholder="ej. marketing, estrategia" value={form.tags} onChange={e=>setForm({...form,tags:e.target.value})}/></div>
            </div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
              <button className="btn btn-ghost" onClick={()=>setShowMod(false)}>Cancelar</button>
              <button className="btn btn-r" onClick={add}>Crear</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ====================== METAS ====================== */
function PageMetas({state,setState,showToast}){
  const [filter,setFilter]=useState('Todas');
  const [showMod,setShowMod]=useState(false);
  const [editId,setEditId]=useState(null);
  const [editVal,setEditVal]=useState('');
  const [form,setForm]=useState({name:'',cur:0,target:100,unit:'%',cat:'Finanzas',icon:'💰',color:'#48bb78'});
  const CATS=['Finanzas','Carrera','Salud','Personal','Educación','Otros'];
  const ICONS=['💰','🚀','💪','⭐','📚','🏠','✈','🎯','🔥','💎'];
  const COLORS=['#48bb78','#ed8936','#4299e1','#9f7aea','#e53e3e','#f6e05e','#fc8181','#63b3ed'];
  const CAT_COLORS={'Finanzas':'#48bb78','Carrera':'#ed8936','Salud':'#e53e3e','Personal':'#f6e05e','Educación':'#4299e1','Otros':'#a0a0a0'};

  const filtered=state.goals.filter(g=>{
    if(filter==='Todas') return true;
    if(filter==='Activas') return g.cur<g.target;
    if(filter==='Completadas') return g.cur>=g.target;
    if(filter==='Atrasadas') return false;
    return true;
  });

  const add=()=>{
    if(!form.name.trim()) return;
    setState(p=>({...p,goals:[...p.goals,{id:Date.now(),name:form.name,cur:Number(form.cur),target:Number(form.target),unit:form.unit,cat:form.cat,icon:form.icon,color:form.color}]}));
    setForm({name:'',cur:0,target:100,unit:'%',cat:'Finanzas',icon:'💰',color:'#48bb78'});
    setShowMod(false);
  };
  const update=(id)=>{
    const val=parseFloat(editVal);
    setState(p=>({...p,goals:p.goals.map(g=>{
      if(g.id!==id) return g;
      const ng={...g,cur:Math.min(g.target,Math.max(0,val))};
      if(ng.cur>=ng.target) showToast({icon:'🏆',title:'¡META CUMPLIDA!',sub:ng.name});
      return ng;
    })}));
    setEditId(null);
  };
  const del=(id)=>setState(p=>({...p,goals:p.goals.filter(g=>g.id!==id)}));

  return(
    <div>
      <div className="ph">
        <div>
          <div className="st">Metas</div>
          <div className="st-sub">{state.goals.filter(g=>g.cur<g.target).length} activas · {state.goals.filter(g=>g.cur>=g.target).length} completadas</div>
        </div>
        <button className="btn-r-lg" onClick={()=>setShowMod(true)}>+ Nueva Meta</button>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:20}}>
        {['Todas','Activas','Completadas','Atrasadas'].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} style={{padding:'7px 16px',borderRadius:20,border:`1px solid ${filter===f?'var(--red)':'var(--bor)'}`,background:filter===f?'var(--red)':'transparent',color:filter===f?'#fff':'var(--t2)',cursor:'pointer',fontSize:13,fontWeight:500,fontFamily:'Inter'}}>{f}</button>
        ))}
      </div>

      <div className="g3">
        {filtered.map(g=>{
          const pct=Math.min(100,g.target>0?Math.round((g.cur/g.target)*100):0);
          const bgMap={'Finanzas':'rgba(72,187,120,0.08)','Carrera':'rgba(237,137,54,0.08)','Salud':'rgba(229,62,62,0.08)','Personal':'rgba(246,224,94,0.08)','Educación':'rgba(66,153,225,0.08)','Otros':'rgba(160,160,160,0.08)'};
          return(
            <div key={g.id} style={{background:bgMap[g.cat]||'var(--bg3)',border:`1px solid ${g.color}22`,borderRadius:12,padding:'16px',position:'relative',overflow:'hidden'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                <div style={{width:40,height:40,borderRadius:'50%',background:`${g.color}22`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>{g.icon}</div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{background:'rgba(255,255,255,0.08)',borderRadius:12,padding:'3px 10px',fontSize:11,fontWeight:600,color:'var(--t2)'}}>En progreso</span>
                  <button className="del" onClick={()=>del(g.id)}>✕</button>
                </div>
              </div>
              <div style={{marginTop:10,marginBottom:6}}>
                <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{g.name}</div>
                <span style={{background:`${CAT_COLORS[g.cat]||'#888'}22`,color:CAT_COLORS[g.cat]||'#888',borderRadius:12,padding:'2px 9px',fontSize:11,fontWeight:600}}>{g.icon} {g.cat}</span>
              </div>
              <div style={{marginTop:12}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t3)',marginBottom:4,textTransform:'uppercase',letterSpacing:0.8,fontWeight:600}}>
                  <span>PROGRESO</span>
                  <span style={{color:g.color,fontWeight:700}}>{pct}%</span>
                </div>
                <div className="pbar"><div className="pfill" style={{width:`${pct}%`,background:g.color}}></div></div>
                <div style={{fontSize:12,color:'var(--t3)',marginTop:5}}>{g.cur.toLocaleString()} {g.unit} / {g.target.toLocaleString()} {g.unit}</div>
              </div>
              {editId===g.id?(
                <div style={{display:'flex',gap:6,marginTop:10}}>
                  <input className="inp" type="number" value={editVal} onChange={e=>setEditVal(e.target.value)} style={{flex:1,padding:'6px 10px'}}/>
                  <button className="btn btn-r btn-sm" onClick={()=>update(g.id)}>OK</button>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setEditId(null)}>✕</button>
                </div>
              ):(
                <button onClick={()=>{setEditId(g.id);setEditVal(g.cur);}} style={{marginTop:12,width:'100%',background:'transparent',border:`1px solid ${g.color}55`,color:g.color,borderRadius:8,padding:'8px',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'Inter'}}>Actualizar Progreso</button>
              )}
            </div>
          );
        })}
      </div>

      {showMod&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setShowMod(false)}>
          <div className="mod">
            <div className="mod-t">Nueva Meta</div>
            <div className="fg"><label className="fl">NOMBRE</label><input className="inp" placeholder="ej. Ingreso mensual $5000" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} autoFocus/></div>
            <div className="frow">
              <div className="fg" style={{flex:1}}><label className="fl">ACTUAL</label><input className="inp" type="number" value={form.cur} onChange={e=>setForm({...form,cur:e.target.value})}/></div>
              <div className="fg" style={{flex:1}}><label className="fl">OBJETIVO</label><input className="inp" type="number" value={form.target} onChange={e=>setForm({...form,target:e.target.value})}/></div>
              <div className="fg" style={{flex:1}}><label className="fl">UNIDAD</label><input className="inp" placeholder="%, $, km..." value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})}/></div>
            </div>
            <div className="frow">
              <div className="fg" style={{flex:1}}><label className="fl">CATEGORÍA</label><select className="inp" value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
            </div>
            <div className="fg"><label className="fl">ICONO</label><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{ICONS.map(ic=><div key={ic} onClick={()=>setForm({...form,icon:ic})} style={{width:34,height:34,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,cursor:'pointer',border:`2px solid ${form.icon===ic?'var(--red)':'var(--bor)'}`,background:'var(--bg4)'}}>{ic}</div>)}</div></div>
            <div className="fg"><label className="fl">COLOR</label><div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{COLORS.map(c=><div key={c} onClick={()=>setForm({...form,color:c})} style={{width:28,height:28,borderRadius:'50%',background:c,cursor:'pointer',border:form.color===c?'3px solid #fff':'3px solid transparent'}}></div>)}</div></div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
              <button className="btn btn-ghost" onClick={()=>setShowMod(false)}>Cancelar</button>
              <button className="btn btn-r" onClick={add}>Crear</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* SAVINGS GOAL ITEM - separate component to avoid hook-in-map violation */
function SavingsGoalItem({g,pct,state,setState}){
  const [editOpen,setEditOpen]=useState(false);
  const [val,setVal]=useState(g.cur);
  const save=()=>{
    const n=parseFloat(val)||0;
    setState(p=>({...p,savingsGoals:p.savingsGoals.map(sg=>sg.id===g.id?{...sg,cur:Math.min(sg.target,Math.max(0,n))}:sg)}));
    setEditOpen(false);
  };
  return(
    <div style={{border:`1px solid ${g.color}33`,borderLeft:`3px solid ${g.color}`,borderRadius:8,padding:'12px 14px',marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <span style={{fontSize:14,fontWeight:600}}>{g.name}</span>
        <span style={{fontSize:14,fontWeight:700,color:pct>=100?'var(--green)':'var(--red)'}}>{pct}%</span>
      </div>
      <div style={{fontSize:12,color:'var(--t3)',marginBottom:4}}>
        <span style={{fontWeight:700,color:'#fff'}}>${g.cur.toLocaleString('en',{minimumFractionDigits:2})}</span>
        <span> / ${g.target.toLocaleString('en',{minimumFractionDigits:2})}</span>
      </div>
      <div style={{fontSize:11,color:'var(--t3)',marginBottom:8}}>Faltan ${(g.target-g.cur).toLocaleString('en',{minimumFractionDigits:2})}</div>
      <div className="pbar"><div className="pfill" style={{width:`${pct}%`,background:g.color}}></div></div>
      {editOpen?(
        <div style={{display:'flex',gap:6,marginTop:10}}>
          <input className="inp" type="number" value={val} onChange={e=>setVal(e.target.value)} style={{flex:1,padding:'5px 10px'}}/>
          <button onClick={save} style={{background:'var(--red)',border:'none',color:'#fff',borderRadius:6,padding:'5px 12px',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Inter'}}>OK</button>
          <button onClick={()=>setEditOpen(false)} style={{background:'transparent',border:'1px solid var(--bor2)',color:'var(--t2)',borderRadius:6,padding:'5px 10px',fontSize:12,cursor:'pointer',fontFamily:'Inter'}}>✕</button>
        </div>
      ):(
        <button onClick={()=>{setVal(g.cur);setEditOpen(true);}} style={{marginTop:10,background:'transparent',border:`1px solid ${g.color}55`,color:g.color,borderRadius:6,padding:'5px 12px',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Inter'}}>+ Actualizar</button>
      )}
    </div>
  );
}

/* ====================== FINANZAS ====================== */
function PageFinanzas({state,setState,showToast}){
  const [tab,setTab]=useState('Resumen');
  const [txFilter,setTxFilter]=useState('Todos');
  const [showMod,setShowMod]=useState(false);
  const [form,setForm]=useState({name:'',amount:'',type:'expense',cat:'otros'});
  const [curMonth,setCurMonth]=useState(new Date().getMonth());
  const [curYear,setCurYear]=useState(new Date().getFullYear());
  const CATS=['trabajo','vivienda','comida','transporte','entretenimiento','salud','ahorro','otros'];
  const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const txMonth=state.transactions.filter(t=>{
    const d=new Date(t.date);
    return d.getMonth()===curMonth&&d.getFullYear()===curYear;
  });
  const inc=txMonth.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
  const exp=txMonth.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
  const bal=inc-exp;

  const add=()=>{
    if(!form.name.trim()||!form.amount) return;
    setState(p=>({...p,transactions:[...p.transactions,{id:Date.now(),name:form.name,amount:parseFloat(form.amount),type:form.type,cat:form.cat,date:new Date().toISOString().slice(0,10)}]}));
    setForm({name:'',amount:'',type:'expense',cat:'otros'});
    setShowMod(false);
  };
  const del=(id)=>setState(p=>({...p,transactions:p.transactions.filter(t=>t.id!==id)}));

  const filteredTx=txMonth.filter(t=>txFilter==='Todos'||(txFilter==='Gastos'&&t.type==='expense')||(txFilter==='Ingresos'&&t.type==='income'));
  const catExp={};txMonth.filter(t=>t.type==='expense').forEach(t=>{catExp[t.cat]=(catExp[t.cat]||0)+t.amount;});

  const totalSavings=state.savingsGoals.reduce((a,g)=>a+g.cur,0);
  const totalTarget=state.savingsGoals.reduce((a,g)=>a+g.target,0);
  const savPct=totalTarget>0?Math.round((totalSavings/totalTarget)*100):0;

  return(
    <div>
      <div className="ph">
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <button onClick={()=>{let m=curMonth-1;let y=curYear;if(m<0){m=11;y--;}setCurMonth(m);setCurYear(y);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t2)',fontSize:18}}>‹</button>
          <span style={{fontSize:16,fontWeight:700}}>{MONTHS[curMonth]} {curYear}</span>
          <button onClick={()=>{let m=curMonth+1;let y=curYear;if(m>11){m=0;y++;}setCurMonth(m);setCurYear(y);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t2)',fontSize:18}}>›</button>
          <div style={{marginLeft:'auto',background:'var(--bg3)',border:'1px solid var(--bor)',borderRadius:8,padding:'6px 12px',fontSize:13,color:'var(--t2)'}}>$ USD ▾</div>
        </div>
      </div>

      {/* BALANCE CARD */}
      <div className="card2" style={{marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--t3)',marginBottom:8}}>Saldo del mes</div>
        <div style={{fontSize:44,fontWeight:800,marginBottom:14}}>${bal.toLocaleString('en',{minimumFractionDigits:2})}</div>
        <div className="g2" style={{gap:10,marginBottom:12}}>
          <div style={{background:'rgba(72,187,120,0.08)',border:'1px solid rgba(72,187,120,0.2)',borderRadius:8,padding:'12px 14px'}}>
            <div style={{fontSize:11,color:'var(--green)',fontWeight:600,marginBottom:4}}>↓ Ingresos</div>
            <div style={{fontSize:22,fontWeight:700,color:'var(--green)'}}>${inc.toLocaleString('en',{minimumFractionDigits:2})}</div>
          </div>
          <div style={{background:'rgba(229,62,62,0.08)',border:'1px solid rgba(229,62,62,0.2)',borderRadius:8,padding:'12px 14px'}}>
            <div style={{fontSize:11,color:'var(--red)',fontWeight:600,marginBottom:4}}>↑ Gastos</div>
            <div style={{fontSize:22,fontWeight:700,color:'var(--red)'}}>${exp.toLocaleString('en',{minimumFractionDigits:2})}</div>
          </div>
        </div>
        <div style={{border:'1px dashed var(--bor)',borderRadius:8,padding:'10px',textAlign:'center',fontSize:13,color:'var(--t3)',cursor:'pointer'}}>○ Definir limite de gastos mensual</div>
      </div>

      {/* TABS */}

/* ====================== CALENDARIO ====================== */
function PageCalendario({state,setState}){
  const [curM,setCurM]=useState(new Date().getMonth());
  const [curY,setCurY]=useState(new Date().getFullYear());
  const [selDay,setSelDay]=useState(new Date().getDate());
  const [showMod,setShowMod]=useState(false);
  const [form,setForm]=useState({title:'',date:'',time:'',color:'#e53e3e'});
  const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DAYS_H=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  const firstDay=new Date(curY,curM,1).getDay();
  const daysInMonth=new Date(curY,curM+1,0).getDate();
  const today=new Date();
  const isToday=(d)=>d===today.getDate()&&curM===today.getMonth()&&curY===today.getFullYear();

  const selDateStr=`${curY}-${String(curM+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
  const selEvents=(state.events||[]).filter(e=>e.date===selDateStr);
  const monthLabel=`${String(selDay).toString().padStart(2,'0')} De ${MONTHS[curM]}`;

  const add=()=>{
    if(!form.title.trim()) return;
    setState(p=>({...p,events:[...(p.events||[]),{id:Date.now(),title:form.title,date:form.date||selDateStr,time:form.time,color:form.color}]}));
    setForm({title:'',date:'',time:'',color:'#e53e3e'});
    setShowMod(false);
  };
  const del=(id)=>setState(p=>({...p,events:(p.events||[]).filter(e=>e.id!==id)}));
  const upcoming=(state.events||[]).filter(e=>new Date(e.date)>=today).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,5);

  const cells=[];
  for(let i=0;i<firstDay;i++) cells.push(null);

  return(

            <span style={{fontSize:15,fontWeight:700}}>{MONTHS[curM]} {curY}</span>
            <button onClick={()=>{let m=curM+1;let y=curY;if(m>11){m=0;y++;}setCurM(m);setCurY(y);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t2)',fontSize:20,padding:'0 8px'}}>›</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:8}}>
            {DAYS_H.map(d=><div key={d} style={{textAlign:'center',fontSize:11,color:'var(--t3)',fontWeight:600,padding:'4px'}}>{d}</div>)}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4}}>
            {cells.map((d,i)=>{
              if(!d) return <div key={i}></div>;
              const ds=`${curY}-${String(curM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
              const hasEv=(state.events||[]).some(e=>e.date===ds);
              return(
                <div key={i} onClick={()=>setSelDay(d)} style={{aspectRatio:'1',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',position:'relative',background:isToday(d)?'var(--red)':selDay===d?'var(--bg5)':'transparent',border:isToday(d)?'none':selDay===d?'1px solid var(--red)':'1px solid transparent',fontSize:13,fontWeight:isToday(d)?700:400,transition:'all .12s'}} onMouseOver={e=>{if(!isToday(d)&&selDay!==d)e.currentTarget.style.background='var(--bg4)';}} onMouseOut={e=>{if(!isToday(d)&&selDay!==d)e.currentTarget.style.background='transparent';}}>
                  {d}
                  {hasEv&&<div style={{position:'absolute',bottom:3,width:4,height:4,borderRadius:'50%',background:isToday(d)?'#fff':'var(--red)'}}></div>}
                </div>
              );
            })}
          </div>
        </div>

        {/* SELECTED DAY */}
        <div className="card2">
          <div style={{fontSize:16,fontWeight:700,marginBottom:16}}>{monthLabel}</div>
          {selEvents.length===0?(
            <div style={{textAlign:'center',padding:'30px 0',color:'var(--t3)',fontSize:13}}>Sin eventos</div>
          ):selEvents.map(e=>(
            <div key={e.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px',background:'var(--bg4)',borderRadius:8,marginBottom:6}}>
              <div style={{width:4,height:30,borderRadius:2,background:e.color||'var(--red)',flexShrink:0}}></div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:500}}>{e.title}</div>
                {e.time&&<div style={{fontSize:11,color:'var(--t3)'}}>{e.time}</div>}
              </div>
              <button className="del" onClick={()=>del(e.id)}>✕</button>
            </div>
          ))}
          <button onClick={()=>{setShowMod(true);setForm({...form,date:selDateStr});}} style={{marginTop:12,width:'100%',background:'transparent',border:'1px dashed var(--bor)',borderRadius:8,padding:'8px',fontSize:12,color:'var(--t3)',cursor:'pointer',fontFamily:'Inter',display:'flex',alignItems:'center',justifyContent:'center',gap:4}} onMouseOver={e=>{e.currentTarget.style.borderColor='var(--red-b)';e.currentTarget.style.color='var(--red)';}} onMouseOut={e=>{e.currentTarget.style.borderColor='var(--bor)';e.currentTarget.style.color='var(--t3)';}}>+ Nuevo Evento</button>
        </div>
      </div>

      {/* UPCOMING */}
      <div className="card2" style={{marginTop:16}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>Próximos eventos</div>
        {upcoming.length===0?<div style={{textAlign:'center',padding:'20px',color:'var(--t3)',fontSize:13}}>Sin eventos próximos</div>:upcoming.map(e=>(
          <div key={e.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid var(--bor)'}}>
            <div style={{width:6,height:6,borderRadius:'50%',background:e.color||'var(--red)',flexShrink:0}}></div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:500}}>{e.title}</div>
              <div style={{fontSize:11,color:'var(--t3)'}}>{e.date}{e.time?` · ${e.time}`:''}</div>
            </div>
            <button className="del" onClick={()=>del(e.id)}>✕</button>
          </div>
        ))}
      </div>

      {showMod&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setShowMod(false)}>
          <div className="mod">
            <div className="mod-t">Nuevo Evento</div>
            <div className="fg"><label className="fl">TÍTULO</label><input className="inp" placeholder="ej. Reunión de trabajo" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} autoFocus onKeyDown={e=>e.key==='Enter'&&add()}/></div>
            <div className="frow">
              <div className="fg" style={{flex:1}}><label className="fl">FECHA</label><input className="inp" type="date" value={form.date||selDateStr} onChange={e=>setForm({...form,date:e.target.value})}/></div>
              <div className="fg" style={{flex:1}}><label className="fl">HORA</label><input className="inp" type="time" value={form.time} onChange={e=>setForm({...form,time:e.target.value})}/></div>

          </div>
        </div>
      )}
    </div>
  );
}

/* ====================== ENFOQUE ====================== */
function PageEnfoque({state,setState,showToast}){
  const [running,setRunning]=useState(false);
  const [phase,setPhase]=useState('work');
  const [secs,setSecs]=useState(state.pomodoro.workMin*60);
  const [sessions,setSessions]=useState(state.pomodoro.sessionsToday);
  const [total,setTotal]=useState(state.pomodoro.total||0);
  const [selTask,setSelTask]=useState('');
  const iRef=useRef(null);

  const workS=state.pomodoro.workMin*60;
  const breakS=state.pomodoro.breakMin*60;
  const longS=(state.pomodoro.longBreakMin||15)*60;

  useEffect(()=>{setSecs(phase==='work'?workS:phase==='break'?breakS:longS);},[phase,state.pomodoro.workMin,state.pomodoro.breakMin,state.pomodoro.longBreakMin]);

  useEffect(()=>{
    if(running){
      iRef.current=setInterval(()=>{
        setSecs(s=>{
          if(s<=1){
            clearInterval(iRef.current);setRunning(false);
            if(phase==='work'){
              const ns=sessions+1;const nt=total+1;
              setSessions(ns);setTotal(nt);
              setState(p=>({...p,pomodoro:{...p.pomodoro,sessionsToday:ns,total:nt}}));
              showToast({icon:'🍅',title:'+25 XP',sub:'¡Pomodoro completado!'});
              setPhase((ns%4===0)?'longbreak':'break');
            } else setPhase('work');
            return 0;
          }
          return s-1;
        });
      },1000);
    }
    return()=>clearInterval(iRef.current);
  },[running,phase]);

  const totalSecs=phase==='work'?workS:phase==='break'?breakS:longS;
  const pct=((totalSecs-secs)/totalSecs)*100;
  const circ=2*Math.PI*90;
  const offset=circ-(pct/100)*circ;
  const m=Math.floor(secs/60).toString().padStart(2,'0');
  const s2=(secs%60).toString().padStart(2,'0');
  const pendingTasks=state.tasks.filter(t=>t.status!=='done');

  return(
    <div>
      <div className="ph">
        <div>
          <div className="st">Enfoque</div>
          <div className="st-sub">Mantén el enfoque con Pomodoro</div>
        </div>
        <button className="btn btn-ghost" style={{display:'flex',alignItems:'center',gap:6,borderColor:'var(--red-b)',color:'var(--red)'}}>⚙ Configuración</button>
      </div>

      {/* TASK SELECTOR */}
      <div style={{background:'var(--bg3)',border:'1px solid var(--bor)',borderRadius:10,padding:'12px 16px',marginBottom:20,display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:11,fontWeight:700,letterSpacing:1,textTransform:'uppercase',color:'var(--t3)',flexShrink:0}}>TAREA:</span>
        <select value={selTask} onChange={e=>setSelTask(e.target.value)} style={{flex:1,background:'transparent',border:'none',color:selTask?'#fff':'var(--t3)',fontSize:13,outline:'none',cursor:'pointer',fontFamily:'Inter'}}>
          <option value="">Sin tarea seleccionada</option>
          {pendingTasks.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <span style={{color:'var(--t3)',fontSize:14}}>▾</span>
      </div>

      {/* TIMER CARD */}
      <div style={{background:'var(--bg2)',border:'1px solid var(--bor)',borderRadius:12,padding:'40px 24px',marginBottom:20,display:'flex',flexDirection:'column',alignItems:'center'}}>
        <div style={{position:'relative',width:200,height:200,marginBottom:20}}>
          <svg width="200" height="200" style={{transform:'rotate(-90deg)'}}>
            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="6"/>
            <circle cx="100" cy="100" r="90" fill="none" stroke={phase==='work'?'var(--red)':phase==='break'?'var(--green)':'var(--purple)'} strokeWidth="6" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={offset} style={{transition:'stroke-dashoffset 1s linear'}}/>
          </svg>
          <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
            <div style={{fontSize:11,color:'var(--red)',fontWeight:700,letterSpacing:3,textTransform:'uppercase',marginBottom:4}}>
              {phase==='work'?'FOCO':phase==='break'?'DESCANSO':'PAUSA LARGA'}
            </div>
            <div style={{fontSize:52,fontWeight:800,letterSpacing:2,color:running?(phase==='work'?'var(--green)':'var(--orange)'):'#fff'}}>{m}:{s2}</div>
            <div style={{display:'flex',gap:5,marginTop:8}}>
              {[...Array(4)].map((_,i)=><div key={i} style={{width:6,height:6,borderRadius:'50%',background:i<(sessions%4)?'var(--red)':'rgba(255,255,255,0.1)'}}></div>)}
            </div>
          </div>
        </div>

        <div style={{display:'flex',alignItems:'center',gap:24}}>
          <button onClick={()=>{setRunning(false);clearInterval(iRef.current);setSecs(phase==='work'?workS:breakS);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:22,padding:'0 4px'}}>↺</button>
          <button onClick={()=>setRunning(r=>!r)} style={{width:56,height:56,borderRadius:'50%',background:'var(--red)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,color:'#fff',boxShadow:'0 4px 16px rgba(229,62,62,0.4)'}}>
            {running?'⏸':'▶'}
          </button>
          <button onClick={()=>{setRunning(false);clearInterval(iRef.current);setPhase(p=>p==='work'?'break':'work');}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:22,padding:'0 4px'}}>⏭</button>
        </div>

        <div style={{display:'flex',gap:40,marginTop:16}}>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:800}}>{sessions}</div>
            <div style={{fontSize:11,color:'var(--t3)'}}>hoje</div>
          </div>
          <div style={{width:1,background:'var(--bor)'}}></div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:800}}>{total}</div>
            <div style={{fontSize:11,color:'var(--t3)'}}>total</div>
          </div>
        </div>
      </div>

      {/* HOW IT WORKS */}
      <div className="card2">
        <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>Como funciona</div>
        <div className="g3">
          {[
            {ico:'🧠',time:'25min',label:'Trabajo',color:'#ed64a6'},
            {ico:'☕',time:'5min',label:'Pausa Corta',color:'#48bb78'},
            {ico:'🏖',time:'15min',label:'Pausa Larga',color:'#9f7aea'},
          ].map(s=>(
            <div key={s.label} style={{background:'var(--bg4)',borderRadius:10,padding:'20px 16px',textAlign:'center',border:'1px solid var(--bor)'}}>
              <div style={{fontSize:28,marginBottom:8}}>{s.ico}</div>
              <div style={{fontSize:24,fontWeight:800,color:s.color}}>{s.time}</div>
              <div style={{fontSize:12,color:'var(--t3)',marginTop:4}}>{s.label}</div>
            </div>
          ))}
        </div>
        <div style={{textAlign:'center',fontSize:12,color:'var(--t3)',marginTop:14,borderTop:'1px solid var(--bor)',paddingTop:12}}>
          Após 4 pomodoros → Pausa longa de 15 minutos
        </div>
      </div>
    </div>
  );
}

function ActivityMap(){
  const weeks=16;
  const days=7;
  const today=new Date();
  const cells=[];
  for(let w=weeks-1;w>=0;w--){
    const week=[];
    for(let d=0;d<days;d++){
      const date=new Date(today);
      date.setDate(today.getDate()-(w*7+(days-1-d)));
      const isToday=date.toDateString()===today.toDateString();
      week.push({date,isToday,val:isToday?1:0});
    }
    cells.push(week);
  }
  const MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const DAY_LABELS=['D','S','T','Q','Q','S','S'];
  const getColor=(val,isToday)=>{
    if(isToday) return 'rgba(229,62,62,0.6)';
    if(val===0) return 'var(--bg4)';
    if(val<2) return 'rgba(229,62,62,0.2)';
    if(val<4) return 'rgba(229,62,62,0.5)';
    return 'var(--red)';
  };
  const monthLabels=[];
  cells.forEach((week,wi)=>{
    const m=week[0].date.getMonth();
    if(wi===0||(wi>0&&cells[wi-1][0].date.getMonth()!==m)){
      monthLabels.push({wi,label:MONTHS[m]});
    }
  });
  return(
    <div style={{overflowX:'auto'}}>
      <div style={{display:'flex',gap:3,paddingBottom:4}}>
        <div style={{width:16}}></div>
        {cells.map((week,wi)=>(
          <div key={wi} style={{width:14,fontSize:9,color:'var(--t3)',textAlign:'center'}}>
            {monthLabels.find(m=>m.wi===wi)?monthLabels.find(m=>m.wi===wi).label:''}
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:3}}>
        <div style={{display:'flex',flexDirection:'column',gap:2,paddingTop:2}}>
          {DAY_LABELS.map((d,i)=><div key={i} style={{height:14,fontSize:9,color:'var(--t3)',lineHeight:'14px'}}>{d}</div>)}
        </div>
        {cells.map((week,wi)=>(
          <div key={wi} style={{display:'flex',flexDirection:'column',gap:2}}>
            {week.map((cell,di)=>(
              <div key={di} title={cell.date.toLocaleDateString()} style={{width:14,height:14,borderRadius:2,background:getColor(cell.val,cell.isToday),border:cell.isToday?'1px solid var(--red)':'none'}}></div>
            ))}
          </div>
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:6,marginTop:10,justifyContent:'flex-end',fontSize:10,color:'var(--t3)'}}>
        <span>Menos</span>
        {['var(--bg4)','rgba(229,62,62,0.2)','rgba(229,62,62,0.5)','rgba(229,62,62,0.8)','var(--red)'].map((c,i)=>(
          <div key={i} style={{width:12,height:12,borderRadius:2,background:c}}></div>
        ))}
        <span>Mais</span>
      </div>
    </div>
  );
}

function WeeklyChart({habits,tasks,pomodoro}){
  const days=['quinta','sexta','sábado','domingo','segunda','terça','quarta'];
  const habitsData=[3,3,3,3,3,3,habits.filter(h=>h.doneToday).length];
  const tasksData=[4,3,2,1,2,1,tasks.filter(t=>t.status==='done').length];
  const pomData=[1,1,1,1,1,1,pomodoro.sessionsToday];
  const maxVal=8;
  const w=560,h=120,padL=30,padB=20,padT=10;
  const chartW=w-padL,chartH=h-padB-padT;
  const getY=(val)=>padT+chartH-(val/maxVal)*chartH;
  const getX=(i)=>padL+(i/(days.length-1))*chartW;
  const makePath=(data)=>data.map((v,i)=>`${i===0?'M':'L'}${getX(i).toFixed(1)},${getY(v).toFixed(1)}`).join(' ');
  const makeArea=(data)=>makePath(data)+` L${getX(days.length-1).toFixed(1)},${(padT+chartH).toFixed(1)} L${getX(0).toFixed(1)},${(padT+chartH).toFixed(1)} Z`;
  return(
    <div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{display:'block',height:120}}>
        {[0,2,4,6,8].map(v=>(
          <g key={v}>
            <line x1={padL} y1={getY(v)} x2={w} y2={getY(v)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
            <text x={padL-4} y={getY(v)+4} textAnchor="end" fill="rgba(255,255,255,0.3)" fontSize="9">{v}</text>
          </g>
        ))}
        <path d={makeArea(habitsData)} fill="rgba(72,187,120,0.1)"/>
        <path d={makePath(habitsData)} fill="none" stroke="#48bb78" strokeWidth="2"/>
        <path d={makeArea(tasksData)} fill="rgba(229,62,62,0.1)"/>
        <path d={makePath(tasksData)} fill="none" stroke="#e53e3e" strokeWidth="2"/>
        <path d={makeArea(pomData)} fill="rgba(159,122,234,0.08)"/>
        <path d={makePath(pomData)} fill="none" stroke="#9f7aea" strokeWidth="2"/>
        {days.map((d,i)=>(
          <text key={i} x={getX(i).toFixed(1)} y={h-4} textAnchor="middle" fill="rgba(255,255,255,0.25)" fontSize="9">{d}</text>
        ))}
      </svg>
      <div style={{display:'flex',justifyContent:'center',gap:16,marginTop:10,fontSize:11,color:'var(--t3)'}}>
        {[{c:'#e53e3e',l:'Tareas'},{c:'#48bb78',l:'Hábitos'},{c:'#9f7aea',l:'Pomodoros'}].map(s=>(
          <div key={s.l} style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:20,height:2,background:s.c,borderRadius:1}}></div>
            <div style={{width:6,height:6,borderRadius:'50%',background:s.c}}></div>
            {s.l}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ====================== PLAN DEL DIA ====================== */
function PagePlan({state,setState}){
  const [showMod,setShowMod]=useState(false);
  const [form,setForm]=useState({name:'',priority:'med'});
  const PRIOS=[{v:'high',l:'Alta',c:'var(--red)',bg:'rgba(229,62,62,0.15)'},{v:'med',l:'Media',c:'var(--orange)',bg:'rgba(237,137,54,0.15)'},{v:'low',l:'Baja',c:'var(--green)',bg:'rgba(72,187,120,0.15)'}];
  const now=new Date();
  const ds=now.toLocaleDateString('es',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const toggle=(id)=>setState(p=>({...p,tasks:p.tasks.map(t=>t.id===id?{...t,status:t.status==='done'?'todo':'done'}:t)}));
  const add=()=>{if(!form.name.trim())return;setState(p=>({...p,tasks:[...p.tasks,{id:Date.now(),name:form.name,status:'todo',priority:form.priority,tags:[]}]}));setForm({name:'',priority:'med'});setShowMod(false);};

  return(
    <div>
      <div className="ph">
        <div><div className="st">Plan del día</div><div className="st-sub" style={{textTransform:'capitalize'}}>{ds}</div></div>
        <button className="btn-r-lg" onClick={()=>setShowMod(true)}>+ Agregar bloque</button>
      </div>
      <div className="card2" style={{marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--t2)',letterSpacing:1,textTransform:'uppercase',marginBottom:12}}>📋 TAREAS DE HOY</div>
        {state.tasks.filter(t=>t.status!=='done').map(t=>{
          const p=PRIOS.find(x=>x.v===t.priority)||PRIOS[1];
          return(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid var(--bor)'}}>
              <div onClick={()=>toggle(t.id)} style={{width:18,height:18,borderRadius:4,border:'2px solid var(--bor2)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,flexShrink:0}}></div>
              <span style={{flex:1,fontSize:13}}>{t.name}</span>
              <span style={{background:p.bg,color:p.c,borderRadius:12,padding:'2px 8px',fontSize:11,fontWeight:600}}>{p.l}</span>
            </div>
          );
        })}
        {state.tasks.filter(t=>t.status==='done').map(t=>(
          <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid var(--bor)'}}>
            <div style={{width:18,height:18,borderRadius:4,border:'2px solid var(--green)',background:'var(--green)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'#fff',flexShrink:0}}>✓</div>
            <span style={{flex:1,fontSize:13,textDecoration:'line-through',color:'var(--t3)'}}>{t.name}</span>
          </div>
        ))}
      </div>
      <div className="g2">
        <div className="card2">
          <div style={{fontSize:13,fontWeight:700,color:'var(--t2)',letterSpacing:1,textTransform:'uppercase',marginBottom:12}}>🔥 HÁBITOS DE HOY</div>
          {state.habits.map(h=>(
            <div key={h.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 0',borderBottom:'1px solid var(--bor)'}}>
              <div style={{width:8,height:8,borderRadius:'50%',background:h.doneToday?'var(--green)':'var(--bor2)',flexShrink:0}}></div>
              <span style={{flex:1,fontSize:13,color:h.doneToday?'var(--t3)':'#fff',textDecoration:h.doneToday?'line-through':'none'}}>{h.name}</span>
              <span style={{fontSize:11,color:'var(--green)',fontWeight:600}}>+{h.xp}XP</span>
            </div>
          ))}
        </div>
        <div className="card2">
          <div style={{fontSize:13,fontWeight:700,color:'var(--t2)',letterSpacing:1,textTransform:'uppercase',marginBottom:12}}>◎ METAS ACTIVAS</div>
          {state.goals.slice(0,4).map(g=>{
            const pct=Math.min(100,g.target>0?Math.round((g.cur/g.target)*100):0);
            return(
              <div key={g.id} style={{marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}}>
                  <span style={{color:'var(--t2)'}}>{g.name.slice(0,20)}{g.name.length>20?'...':''}</span>
                  <span style={{color:g.color,fontWeight:700}}>{pct}%</span>
                </div>
                <div className="pbar"><div className="pfill" style={{width:`${pct}%`,background:g.color}}></div></div>
              </div>
            );
          })}
        </div>
      </div>
      {showMod&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setShowMod(false)}>
          <div className="mod">
            <div className="mod-t">Nuevo Bloque</div>
            <div className="fg"><label className="fl">TAREA</label><input className="inp" placeholder="¿Qué hay que hacer?" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} autoFocus onKeyDown={e=>e.key==='Enter'&&add()}/></div>
            <div className="fg"><label className="fl">PRIORIDAD</label><select className="inp" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>{PRIOS.map(p=><option key={p.v} value={p.v}>{p.l}</option>)}</select></div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
              <button className="btn btn-ghost" onClick={()=>setShowMod(false)}>Cancelar</button>
              <button className="btn btn-r" onClick={add}>Agregar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ====================== APP ====================== */
function App(){
  const [state,setRaw]=useState(load);
  const [page,setPage]=useState('dashboard');
  const [toast,setToast]=useState(null);
  const [notifStatus,setNotifStatus]=useState(typeof Notification!=='undefined'?Notification.permission:'default');
  const [canInstall,setCanInstall]=useState(false);
  const [installed,setInstalled]=useState(false);
  const [darkMode,setDarkMode]=useState(true);
  const [sbOpen,setSbOpen]=useState(true);

  // Apply accent color from config
  useEffect(()=>{
    const accent=state.config?.accent;
    if(accent){
      document.documentElement.style.setProperty('--red',accent);
      const r=parseInt(accent.slice(1,3),16),g=parseInt(accent.slice(3,5),16),b=parseInt(accent.slice(5,7),16);
      document.documentElement.style.setProperty('--red2',`rgba(${r},${g},${b},0.8)`);
      document.documentElement.style.setProperty('--red-dim',`rgba(${r},${g},${b},0.12)`);
      document.documentElement.style.setProperty('--red-b',`rgba(${r},${g},${b},0.3)`);
    }
  },[state.config?.accent]);

  // Apply dark/light mode
  useEffect(()=>{
    if(!darkMode){
      document.documentElement.style.setProperty('--bg','#f0f0f0');
      document.documentElement.style.setProperty('--bg2','#ffffff');
      document.documentElement.style.setProperty('--bg3','#f5f5f5');
      document.documentElement.style.setProperty('--bg4','#e8e8e8');
      document.documentElement.style.setProperty('--t','#111111');
      document.documentElement.style.setProperty('--t2','#444444');
      document.documentElement.style.setProperty('--t3','#888888');
      document.documentElement.style.setProperty('--bor','rgba(0,0,0,0.1)');
      document.documentElement.style.setProperty('--bor2','rgba(0,0,0,0.2)');
      document.body.style.background='#f0f0f0';
      document.body.style.color='#111';
    } else {
      document.documentElement.style.setProperty('--bg','#0a0a0a');
      document.documentElement.style.setProperty('--bg2','#111');
      document.documentElement.style.setProperty('--bg3','#181818');
      document.documentElement.style.setProperty('--bg4','#1f1f1f');
      document.documentElement.style.setProperty('--t','#fff');
      document.documentElement.style.setProperty('--t2','#a0a0a0');
      document.documentElement.style.setProperty('--t3','#555');
      document.documentElement.style.setProperty('--bor','rgba(255,255,255,0.07)');
      document.documentElement.style.setProperty('--bor2','rgba(255,255,255,0.12)');
      document.body.style.background='#0a0a0a';
      document.body.style.color='#fff';
    }
  },[darkMode]);

  // Sync darkMode with config
  useEffect(()=>{
    if(state.config?.dark===false) setDarkMode(false);
  },[state.config?.dark]);

  // Check install prompt
  useEffect(()=>{
    const check=()=>{setCanInstall(!!window._dip);setInstalled(!!window._installed);};
    check();
    const t=setInterval(check,1000);
    return()=>clearInterval(t);
  },[]);

  const handleInstall=async()=>{
    if(window._dip){
      window._dip.prompt();
      const result=await window._dip.userChoice;
      if(result.outcome==='accepted'){setInstalled(true);setCanInstall(false);showToast({icon:'📱',title:'¡App instalada!',sub:'EliteLab está en tu pantalla de inicio'});}
      window._dip=null;
    } else {
      // Show instructions for iOS/non-supported
      showToast({icon:'📱',title:'Instalar EliteLab',sub:'En Safari: compartir → Agregar a inicio. En Chrome: menú → Instalar app'});
    }
  };

  const handleNotif=async()=>{
    if(typeof Notification==='undefined'){showToast({icon:'❌',title:'No soportado',sub:'Tu navegador no soporta notificaciones'});return;}
    if(Notification.permission==='granted'){
      new Notification('EliteLab 🔥',{body:'¡Notificaciones ya activadas! Todo funcionando.',icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%23e53e3e"/><text y=".9em" font-size="70" x="15" fill="white">E</text></svg>'});
      return;
    }
    try{
      const perm=await Notification.requestPermission();
      setNotifStatus(perm);
      if(perm==='granted'){
        new Notification('EliteLab 🔥',{body:'¡Notificaciones activadas! Te avisaremos de tus tareas.'});
        showToast({icon:'🔔',title:'¡Notificaciones activadas!',sub:'Recibirás alertas de EliteLab'});
        setState(p=>({...p,showBanner:false}));
      } else {
        showToast({icon:'❌',title:'Permiso denegado',sub:'Activa las notificaciones en la configuración del navegador'});
      }
    }catch(e){showToast({icon:'❌',title:'Error',sub:'No se pudo solicitar permiso'});}
  };

  const setState=useCallback((upd)=>{
    setRaw(prev=>{const next=typeof upd==='function'?upd(prev):upd;save(next);return next;});
  },[]);
  const showToast=useCallback((msg)=>setToast(msg),[]);

  // Schedule daily habit reminder if notifications granted
  useEffect(()=>{
    if(notifStatus!=='granted') return;
    const now=new Date();
    const next9am=new Date(now);
    next9am.setHours(9,0,0,0);
    if(next9am<=now) next9am.setDate(next9am.getDate()+1);
    const ms=next9am-now;
    const t=setTimeout(()=>{
      const pending=state.habits.filter(h=>!h.doneToday).length;
      if(pending>0) new Notification('EliteLab 🔥',{body:`Tienes ${pending} hábito${pending>1?'s':''} pendiente${pending>1?'s':''} hoy`});
    },Math.min(ms,2147483647));
    return()=>clearTimeout(t);
  },[notifStatus,state.habits]);

  const render=()=>{
    const p={state,setState,showToast,setPage};
    switch(page){
      case 'dashboard': return <PageDashboard {...p} handleNotif={handleNotif}/>;
      case 'habitos': return <PageHabitos {...p}/>;
      case 'tareas': return <PageTareas {...p}/>;
      case 'metas': return <PageMetas {...p}/>;
      case 'finanzas': return <PageFinanzas {...p}/>;
      case 'entrenamiento': return <PageEntrenamiento {...p}/>;
      case 'calendario': return <PageCalendario {...p}/>;
      case 'enfoque': return <PageEnfoque {...p}/>;
      case 'progreso': return <PageProgreso {...p}/>;
      case 'logros': return <PageLogros {...p}/>;
      case 'plan': return <PagePlan {...p}/>;
      case 'perfil': return <PagePerfil {...p}/>;
      case 'config': return <PageConfig {...p} darkMode={darkMode} setDarkMode={setDarkMode} handleNotif={handleNotif}/>;
      default: return <PageComingSoon title={PAGES[page]||page}/>;
    }
  };

  const notifBtnLabel = notifStatus==='granted' ? '🔔' : notifStatus==='denied' ? '🔕' : '🔔';

  return(
    <div className="app">
      {/* SIDEBAR */}
      <div className="sb" style={{width:sbOpen?210:0,overflow:sbOpen?'auto':'hidden',transition:'width .2s'}}>
        <div className="sb-logo" style={{display:'flex',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className="sb-logo-icon">𝐸</span>
            <span className="sb-logo-txt">EliteLab</span>
          </div>
          <button onClick={()=>setSbOpen(false)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:16}}>‹</button>
        </div>
        {NAV.map(sec=>(
          <div key={sec.sec}>
            <div className="sb-sec">{sec.sec}</div>
            {sec.items.map(it=>(
              <div key={it.id} className={`ni ${page===it.id?'active':''}`} onClick={()=>setPage(it.id)}>
                <span className="ni-ico">{it.ico}</span>
                <span>{it.l}</span>
                {it.badge&&<span className={`badge ${it.bc}`}>{it.badge}</span>}
              </div>
            ))}
          </div>
        ))}
        <div className="sb-user" style={{cursor:'pointer'}} onClick={()=>setPage('perfil')}>
          <div className="av">{state.user.avatar||'J'}</div>
          <div style={{fontSize:13,fontWeight:500}}>{state.user.name}</div>
        </div>
      </div>

      {/* MAIN */}
      <div className="main" style={{marginLeft:sbOpen?210:0,transition:'margin-left .2s'}}>
        <div className="tb">
          {!sbOpen&&(
            <button onClick={()=>setSbOpen(true)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--t2)',fontSize:18,marginRight:8}}>☰</button>
          )}
          <div className="tb-brand"><span className="tb-ico">𝐸</span><span>EliteLab</span></div>
          <span className="tb-sep">/</span>
          <span className="tb-pg">{PAGES[page]||page}</span>
          <div className="tb-r">
            <button
              className="tb-icon"
              title={notifStatus==='granted'?'Notificaciones activadas':notifStatus==='denied'?'Notificaciones bloqueadas':'Activar notificaciones'}
              onClick={handleNotif}
              style={{color:notifStatus==='granted'?'var(--yellow)':notifStatus==='denied'?'var(--red)':'var(--t2)',position:'relative'}}
            >
              {notifBtnLabel}
              {notifStatus==='granted'&&<span style={{position:'absolute',top:2,right:2,width:6,height:6,borderRadius:'50%',background:'var(--green)'}}></span>}
            </button>
            {!installed&&(
              <button className="tb-btn" onClick={handleInstall} title={canInstall?'Instalar EliteLab':'Agregar a pantalla de inicio'}>
                ⬇ Instalar app
              </button>
            )}
            {installed&&<span style={{fontSize:12,color:'var(--green)',fontWeight:600}}>✓ Instalada</span>}
            <button className="tb-icon" onClick={()=>setDarkMode(d=>!d)} title={darkMode?'Modo claro':'Modo oscuro'}>
              {darkMode?'☀':'🌙'}
            </button>
          </div>
        </div>
        <div className="cnt">{render()}</div>
      </div>

      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
